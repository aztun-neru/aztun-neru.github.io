<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self';">
<meta name="description" content="AZTUN — hub projektów technologicznych, które działają lokalnie. NERU: osobisty asystent w przeglądarce, offline, bez chmury.">
<meta name="theme-color" content="#07111b">
<title>AZTUN — lokalna inteligencja · NERU</title>
<style>
:root{
  --bg:#07111b; --bg2:#0a1622; --panel:#0d1a27;
  --line:rgba(148,196,214,.14); --line2:rgba(148,196,214,.26);
  --text:#e7f1f2; --mut:#8ba7ad; --mut2:#5f7d87;
  --amber:#ffc24b; --mint:#4fe3a5; --cyan:#5fd4f5; --coral:#ff7a66;
  --mono:ui-monospace,"Cascadia Code","SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --rad:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:var(--amber);color:#17110a}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
section[id]{scroll-margin-top:90px}

/* ---------- ambient background ---------- */
.bg{position:fixed;inset:0;z-index:-3;background:
  radial-gradient(1100px 700px at 84% -12%, rgba(95,212,245,.075), transparent 62%),
  radial-gradient(900px 640px at -12% 34%, rgba(255,194,75,.05), transparent 60%),
  radial-gradient(700px 500px at 60% 110%, rgba(79,227,165,.045), transparent 60%),
  var(--bg)}
.bg-grid{position:fixed;inset:-2px;z-index:-2;pointer-events:none;
  background-image:linear-gradient(rgba(140,200,220,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(140,200,220,.05) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 95% 85% at 50% 0%,#000 25%,transparent 78%);
  mask-image:radial-gradient(ellipse 95% 85% at 50% 0%,#000 25%,transparent 78%);
  animation:gridMove 26s linear infinite}
@keyframes gridMove{to{background-position:0 46px,0 46px}}
.sweep{position:fixed;left:0;right:0;top:0;height:34vh;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(95,212,245,.035) 45%,rgba(79,227,165,.028) 55%,transparent);
  animation:sweep 12s ease-in-out infinite}
@keyframes sweep{0%{transform:translateY(-40vh)}62%{transform:translateY(110vh)}100%{transform:translateY(110vh)}}

/* ---------- shared ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.16,.8,.3,1)}
.rv.in{opacity:1;transform:none}
.kick{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--amber);margin-bottom:18px}
.kick::before{content:'';width:34px;height:1px;background:var(--amber);flex:none}
.sec-t{font-family:var(--mono);font-weight:800;font-size:clamp(1.7rem,4vw,2.6rem);letter-spacing:-.01em;margin-bottom:12px;line-height:1.15}
.sec-sub{color:var(--mut);max-width:58ch;margin-bottom:46px;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;padding:14px 24px;border-radius:10px;cursor:pointer;border:1px solid transparent;transition:transform .25s,box-shadow .25s,border-color .25s,color .25s}
.btn-p{background:var(--amber);color:#17110a;font-weight:700}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(255,194,75,.3)}
.btn-g{border-color:var(--line2);color:var(--text);background:none}
.btn-g:hover{border-color:var(--amber);color:var(--amber);transform:translateY(-2px)}
.ic{flex:none;display:block}

/* ---------- header ---------- */
.hd{position:fixed;top:0;left:0;right:0;z-index:50;padding:16px 0;transition:padding .3s,background .3s,border-color .3s;border-bottom:1px solid transparent}
.hd.sc{background:rgba(7,17,27,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom-color:var(--line);padding:10px 0}
.hd-in{display:flex;align-items:center;gap:26px}
.logo{font-family:var(--mono);font-weight:700;letter-spacing:.16em;font-size:1.02rem}
.logo-c{color:var(--amber);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.nav{margin-left:auto;display:flex;gap:24px}
.nav a{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);position:relative;padding:4px 0;transition:color .25s}
.nav a::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--amber);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.nav a:hover{color:var(--text)}
.nav a:hover::after{transform:scaleX(1)}
.net{font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);display:flex;align-items:center;gap:7px}
.net i{width:7px;height:7px;border-radius:50%;display:inline-block;animation:pulse 2.2s infinite}
.net.on i{background:var(--mint);box-shadow:0 0 10px var(--mint)}
.net.off i{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;flex:none}
.lang button{padding:7px 13px;font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;background:none;border:none;color:var(--mut);cursor:pointer;transition:background .25s,color .25s}
.lang button.on{background:var(--amber);color:#17110a;font-weight:700}

/* ---------- hero ---------- */
.hero{min-height:100svh;display:flex;align-items:center;padding:140px 0 90px;position:relative}
.hero-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:56px;align-items:center;width:100%}
.h-tag{font-family:var(--mono);text-transform:uppercase;letter-spacing:.24em;font-size:clamp(.68rem,1.3vw,.84rem);color:var(--mint);margin-bottom:16px}
.h-title{position:relative;font-family:var(--mono);font-weight:800;font-size:clamp(4rem,12.5vw,8rem);line-height:.95;letter-spacing:-.03em;margin:0 0 22px;z-index:1}
.h-title .ghost{position:absolute;left:.075em;top:.075em;z-index:-1;color:transparent;-webkit-text-stroke:1.5px rgba(255,194,75,.3);user-select:none}
.blockcaret{display:inline-block;width:.42em;height:.72em;background:var(--amber);margin-left:.1em;animation:blink 1.1s steps(2) infinite}
.h-lead{color:var(--mut);font-size:1.08rem;line-height:1.75;max-width:52ch;margin-bottom:34px}
.h-cta{display:flex;gap:14px;flex-wrap:wrap}
.term{font-family:var(--mono);font-size:.76rem;color:var(--mut);border-left:2px solid var(--line2);padding-left:14px;margin-bottom:28px;min-height:66px}
.tl{white-space:pre-wrap;line-height:2;opacity:0;transition:opacity .3s}
.tl.vis{opacity:1}
.tl-p{color:var(--amber);margin-right:9px}
.caret{display:inline-block;width:7px;height:12px;background:var(--mint);margin-left:4px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
.scrollhint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mut2);display:flex;flex-direction:column;align-items:center;gap:6px}
.scrollhint span{animation:dip 1.8s ease-in-out infinite}
@keyframes dip{50%{transform:translateY(5px)}}

/* ---------- core visual ---------- */
.core{position:relative;aspect-ratio:1;max-width:470px;width:100%;margin-left:auto;border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,rgba(16,31,46,.92),rgba(9,18,28,.94));box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.core-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(140,200,220,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(140,200,220,.05) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(circle at 50% 46%,#000 20%,transparent 72%);mask-image:radial-gradient(circle at 50% 46%,#000 20%,transparent 72%)}
.core-sweep{position:absolute;inset:0;background:conic-gradient(from 0deg at 50% 46%,transparent 0deg,transparent 296deg,rgba(95,212,245,.17) 348deg,transparent 360deg);animation:rot 7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ring{position:absolute;border:1px solid rgba(95,212,245,.22);border-radius:50%;left:50%;top:46%;transform:translate(-50%,-50%)}
.r1{width:32%;height:32%}.r2{width:56%;height:56%;border-color:rgba(95,212,245,.14)}.r3{width:80%;height:80%;border-color:rgba(95,212,245,.08)}
.ring.ping{width:32%;height:32%;border-color:rgba(255,194,75,.4);animation:ringPing 3.6s ease-out infinite}
@keyframes ringPing{0%{transform:translate(-50%,-50%) scale(.6);opacity:.9}100%{transform:translate(-50%,-50%) scale(2.4);opacity:0}}
.core-dot{position:absolute;left:50%;top:46%;width:12px;height:12px;transform:translate(-50%,-50%);border-radius:50%;background:var(--amber);box-shadow:0 0 22px var(--amber),0 0 60px rgba(255,194,75,.5);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.45}}
.node{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint);animation:nodeB 3.2s infinite}
@keyframes nodeB{0%,100%{opacity:1}50%{opacity:.15}}
.n1{top:20%;left:24%}.n2{top:38%;right:16%;background:var(--cyan);box-shadow:0 0 12px var(--cyan);animation-delay:-1.2s}.n3{bottom:30%;left:18%;background:var(--amber);box-shadow:0 0 12px var(--amber);animation-delay:-2.1s}.n4{bottom:22%;right:26%;animation-delay:-.6s}
.core-title{position:absolute;top:16px;left:18px;font-family:var(--mono);font-size:.64rem;letter-spacing:.24em;color:var(--amber);display:flex;align-items:center;gap:8px}
.core-title i{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 2s infinite}
.core-readout{position:absolute;left:18px;right:18px;bottom:14px;display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;border-top:1px solid var(--line);padding-top:11px}
.core-readout b{color:var(--mint);font-weight:400}
.tk{position:absolute;width:13px;height:13px;border:2px solid var(--line2)}
.tk1{top:9px;left:9px;border-right:none;border-bottom:none}
.tk2{top:9px;right:9px;border-left:none;border-bottom:none}
.tk3{bottom:9px;left:9px;border-right:none;border-top:none}
.tk4{bottom:9px;right:9px;border-left:none;border-top:none}
.chipf{position:absolute;font-family:var(--mono);font-size:.64rem;padding:5px 11px;border-radius:999px;animation:floaty 6s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-9px)}}
.cf1{top:17%;right:7%;color:var(--cyan);background:rgba(95,212,245,.08);border:1px solid rgba(95,212,245,.3)}
.cf2{bottom:33%;left:6%;color:var(--mint);background:rgba(79,227,165,.08);border:1px solid rgba(79,227,165,.3);animation-delay:-2s}
.cf3{top:52%;right:9%;color:var(--amber);background:rgba(255,194,75,.08);border:1px solid rgba(255,194,75,.3);animation-delay:-4s}

/* ---------- manifest ---------- */
.m-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.m-card{position:relative;padding:36px 28px 30px;background:linear-gradient(180deg,rgba(17,32,46,.92),rgba(10,20,30,.92));border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s}
.m-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),transparent 72%)}
.m-card:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--acc) 55%,transparent);box-shadow:0 18px 44px rgba(0,0,0,.42)}
.m-num{position:absolute;top:16px;right:20px;font-family:var(--mono);font-weight:800;font-size:2.6rem;color:var(--acc);opacity:.15;line-height:1}
.m-ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);margin-bottom:22px;transition:transform .35s,box-shadow .35s}
.m-card:hover .m-ico{transform:rotate(-6deg) scale(1.07);box-shadow:0 0 26px color-mix(in srgb,var(--acc) 32%,transparent)}
.m-card h3{font-family:var(--mono);font-size:1rem;letter-spacing:.06em;margin-bottom:10px;text-transform:uppercase}
.m-card p{color:var(--mut);font-size:.94rem;line-height:1.7}

/* ---------- projects ---------- */
.p-grid{display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:auto auto;gap:22px}
.p-neru{grid-row:1/3;position:relative;padding:42px 40px;border-radius:18px;border:1px solid rgba(255,194,75,.42);display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(620px 320px at 100% 0%,rgba(255,194,75,.13),transparent 60%),linear-gradient(180deg,rgba(20,32,40,.95),rgba(12,20,28,.96));transition:transform .35s,box-shadow .35s}
.p-neru:hover{transform:translateY(-5px);box-shadow:0 26px 64px rgba(0,0,0,.5)}
.p-badge{display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(255,194,75,.42);border-radius:999px;padding:6px 13px;width:max-content;margin-bottom:24px}
.p-badge i{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 2s infinite}
.p-name{font-family:var(--mono);font-weight:800;font-size:clamp(2.6rem,6vw,3.9rem);letter-spacing:.02em;line-height:1;margin-bottom:10px;text-shadow:0 0 40px rgba(255,194,75,.25)}
.p-role{font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);margin-bottom:20px}
.p-desc{color:var(--mut);line-height:1.75;max-width:46ch;margin-bottom:28px}
.p-links{display:flex;gap:12px;margin-top:auto;flex-wrap:wrap}
.eq{display:flex;gap:4px;align-items:flex-end;height:26px;position:absolute;right:36px;bottom:36px}
.eq span{width:3px;border-radius:2px;background:var(--amber);animation:eq 1.15s ease-in-out infinite}
@keyframes eq{0%,100%{height:6px}50%{height:24px}}
.p-soon{border:1px dashed var(--line2);border-radius:16px;padding:30px;display:flex;align-items:center;gap:18px;background:rgba(13,26,39,.4);transition:border-color .3s,background .3s;min-height:172px}
.p-soon:hover{border-color:rgba(255,194,75,.55);background:rgba(13,26,39,.72)}
.p-soon .s-plus{color:var(--mut2);flex:none;opacity:.7}
.p-soon .s-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--mut2)}
.p-soon .s-title{font-family:var(--mono);font-weight:700;font-size:1.5rem;color:var(--mut);opacity:.8;margin-top:7px}

/* ---------- features ---------- */
.f-group{margin-bottom:58px}
.f-group:last-child{margin-bottom:0}
.f-head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.f-bar{width:4px;height:28px;border-radius:2px;background:var(--acc);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 50%,transparent);flex:none}
.f-code{font-family:var(--mono);color:var(--acc);font-size:.78rem;letter-spacing:.22em}
.f-head h3{font-family:var(--mono);font-size:clamp(1.1rem,2.4vw,1.45rem);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.f-sub{color:var(--mut);font-size:.94rem;margin:0 0 26px 18px}
.f-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.f-card{background:linear-gradient(180deg,rgba(15,28,41,.9),rgba(10,19,29,.9));border:1px solid var(--line);border-radius:12px;padding:22px 20px;transition:transform .3s cubic-bezier(.2,.7,.2,1),border-color .3s,box-shadow .3s}
.f-card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--acc) 50%,transparent);box-shadow:0 14px 36px rgba(0,0,0,.38)}
.f-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:15px;background:color-mix(in srgb,var(--acc) 13%,transparent);color:var(--acc)}
.f-name{font-family:var(--mono);font-weight:700;font-size:.9rem;margin-bottom:7px}
.f-desc{color:var(--mut);font-size:.85rem;line-height:1.65}

/* ---------- use cases ---------- */
.u-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.u-card{display:flex;flex-direction:column;gap:12px}
.u-b{padding:15px 18px;font-size:.92rem;line-height:1.65;width:90%;transition:border-color .3s,transform .3s}
.u-who{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.24em;margin-bottom:7px}
.u-q{background:rgba(20,36,50,.8);border:1px solid var(--line);border-radius:4px 14px 14px 14px;align-self:flex-end}
.u-q .u-who{color:var(--mut2)}
.u-a{background:rgba(255,194,75,.06);border:1px solid rgba(255,194,75,.22);border-radius:14px 4px 14px 14px;align-self:flex-start}
.u-a .u-who{color:var(--amber)}
.u-a:hover{border-color:rgba(255,194,75,.5);transform:translateY(-2px)}

/* ---------- about ---------- */
.a-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:46px;align-items:start}
.a-who{color:var(--mut);line-height:1.75;font-size:1.02rem}
.a-why{border-left:3px solid var(--amber);padding:8px 0 8px 20px;margin:26px 0;font-size:1.08rem;line-height:1.7;color:var(--text)}
.a-panel{border:1px solid var(--line);border-radius:16px;padding:28px;background:linear-gradient(180deg,rgba(15,28,41,.9),rgba(10,19,29,.9))}
.a-panel h3{font-family:var(--mono);text-transform:uppercase;font-size:.82rem;letter-spacing:.16em;margin-bottom:14px;color:var(--text)}
.a-panel .a-join{color:var(--mut);font-size:.92rem;line-height:1.7;margin-bottom:18px}
.a-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:.88rem}
.a-row .k{color:var(--mut2);font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase}
.a-mail{font-family:var(--mono);color:var(--amber);font-size:.86rem}
.chip{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;padding:5px 10px;border-radius:999px;border:1px solid rgba(79,227,165,.35);color:var(--mint)}
.btn-xs{font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;border:1px solid var(--line2);border-radius:8px;background:none;color:var(--mut);cursor:pointer;transition:color .25s,border-color .25s}
.btn-xs:hover{color:var(--amber);border-color:var(--amber)}
.btn-xs.ok{color:var(--mint);border-color:var(--mint)}

/* ---------- footer ---------- */
.ft{border-top:1px solid var(--line);padding:74px 0 46px;position:relative;overflow:hidden;margin-top:40px}
.ft-ghost{position:absolute;left:50%;transform:translateX(-50%);bottom:-.3em;font-family:var(--mono);font-weight:800;font-size:clamp(6rem,19vw,15rem);line-height:1;color:transparent;-webkit-text-stroke:1px rgba(148,196,214,.08);pointer-events:none;user-select:none;white-space:nowrap}
.ft-in{position:relative;display:flex;flex-direction:column;gap:24px}
.ft-top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.ft-links{display:flex;gap:24px;flex-wrap:wrap}
.ft-links a{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);transition:color .25s}
.ft-links a:hover{color:var(--amber)}
.ft-priv{display:flex;gap:11px;align-items:center;color:var(--mut);font-size:.84rem}
.ft-priv .ic{color:var(--mint)}
.ft-bot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;color:var(--mut2)}

/* ---------- model chat ---------- */
.fab{position:fixed;right:22px;bottom:22px;z-index:70;width:58px;height:58px;border-radius:50%;border:none;background:var(--amber);color:#17110a;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 32px rgba(255,194,75,.35);transition:transform .3s}
.fab:hover{transform:translateY(-3px) scale(1.05)}
.fab::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(255,194,75,.5);animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(.88);opacity:.9}80%,100%{transform:scale(1.55);opacity:0}}
.fab.active::after{display:none}

.chat.closed{opacity:0;transform:translateY(18px) scale(.95);pointer-events:none}
.chat-hd{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(13,25,37,.65)}
.chat-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber);animation:pulse 2s infinite;flex:none}
.chat-name{font-family:var(--mono);font-weight:700;font-size:.92rem;letter-spacing:.08em}
.chat-status{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);border:1px solid rgba(79,227,165,.32);padding:4px 9px;border-radius:999px;margin-left:auto}
.chat-x{background:none;border:none;color:var(--mut);cursor:pointer;padding:6px;display:grid;place-items:center;border-radius:8px;transition:color .2s,background .2s}
.chat-x:hover{color:var(--text);background:rgba(148,196,214,.1)}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.msg{max-width:85%;padding:10px 13px;font-size:.87rem;line-height:1.6;animation:msgIn .3s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(7px)}}
.msg.user{align-self:flex-end;background:rgba(95,212,245,.12);border:1px solid rgba(95,212,245,.26);border-radius:12px 3px 12px 12px}
.msg.bot{align-self:flex-start;background:rgba(255,194,75,.08);border:1px solid rgba(255,194,75,.2);border-radius:3px 12px 12px 12px}
.typing{align-self:flex-start;display:flex;gap:5px;padding:13px 15px;background:rgba(255,194,75,.08);border:1px solid rgba(255,194,75,.2);border-radius:3px 12px 12px 12px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.chat-faq{display:flex;gap:8px;padding:10px 14px 4px;overflow-x:auto;scrollbar-width:none;flex:none}
.chat-faq::-webkit-scrollbar{display:none}
.chat-faq button{white-space:nowrap;font-family:var(--mono);font-size:.66rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:none;color:var(--mut);cursor:pointer;transition:color .2s,border-color .2s;flex:none}
.chat-faq button:hover{color:var(--amber);border-color:var(--amber)}
.chat-in{display:flex;gap:8px;padding:12px 14px 8px;flex:none}
.chat-in input{flex:1;min-width:0;background:rgba(15,29,42,.9);border:1px solid var(--line2);border-radius:10px;padding:11px 14px;color:var(--text);font-family:var(--sans);font-size:.87rem;outline:none;transition:border-color .2s,box-shadow .2s}
.chat-in input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,194,75,.13)}
.chat-send{width:44px;border-radius:10px;border:none;background:var(--amber);color:#17110a;display:grid;place-items:center;cursor:pointer;transition:transform .2s,opacity .2s;flex:none}
.chat-send:hover{transform:translateY(-1px)}
.chat-send:disabled{opacity:.45;cursor:not-allowed}
.chat-note{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mut2);text-align:center;padding:8px 12px 13px;flex:none}

function useReveal(){
  const ref = useRef(null);
  useEffect(()=>{
    const el = ref.current; if(!el) return;
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ el.classList.add('in'); return; }
    const io = new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }); },{threshold:.12});
    io.observe(el); return ()=>io.disconnect();
  },[]);
  return ref;
}
const Reveal = ({children, className='', delay=0}) => {
  const ref = useReveal();
  return <div ref={ref} className={'rv '+className} style={delay?{transitionDelay:delay+'ms'}:undefined}>{children}</div>;

/* ============ hero terminal ============ */
function TypingLines({lines}){
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const total = lines.reduce((a,l)=>a+l.length, 0);
  const [count, setCount] = useState(reduced ? total : 0);
  useEffect(()=>{
    setCount(reduced ? total : 0);
    if(reduced) return;
    let i = 0, alive = true;
    const tick = ()=>{
      if(!alive) return;
      i++; setCount(i);
      if(i < total) setTimeout(tick, 26);
      else setTimeout(()=>{ if(alive){ i = 0; setCount(0); setTimeout(tick, 420); } }, 3400);
    };
    const t0 = setTimeout(tick, 500);
    return ()=>{ alive = false; clearTimeout(t0); };
  }, [total, reduced]);
  let acc = 0;
  return (
    <div className="term" aria-hidden="true">
      {lines.map((l,idx)=>{
        const start = acc; acc += l.length;
        const shown = Math.min(l.length, Math.max(0, count-start));
        const visible = count > start || reduced;
        const active = !reduced && count >= start && shown < l.length;
        return (
          <div key={idx} className={'tl'+(visible?' vis':'')}>
            <span className="tl-p">{idx===0?'$':'>'}</span>{l.slice(0,shown)}{active && <span className="caret"/>}
          </div>
        );
      })}
    </div>
  );
}

/* ============ ModelChat — AI slot ============ */
function faqAnswer(text, ans){
  const s = text.toLowerCase();
  const has = (...ws)=>ws.some(w=>s.indexOf(w)>-1);
  if(has('backup','--encrypt','restore')) return ans.backup;
  if(has('voice','głos','glos','converse')) return ans.voice;
  if(has('onnx','etap','stage')) return ans.onnx;
  if(has('prywat','dane','wysył','wysyl','śledz','sledz','track','privacy','sent','my data','cookie','ciastecz')) return ans.privacy;
  if(has('offline','internet','sieci','without connection')) return ans.offline;
  if(has('zaczą','zaczac','start','install','zainstal','begin')) return ans.start;
  if(has('neru','asystent','assistant','co to','what is')) return ans.neru;
  if(has('cześć','czesc','hej','hello','hi','witaj')) return ans.hello;
  return ans.fallback;
}

function ModelChat({model, lang, t}){
  const [open, setOpen] = useState(false);
  const [msgs, setMsgs] = useState(()=>[{who:'bot', text:t.chat.welcome}]);
  const [input, setInput] = useState('');
  const [typing, setTyping] = useState(false);
  const boxRef = useRef(null);
  const timerRef = useRef(null);
  useEffect(()=>{
    if(boxRef.current) boxRef.current.scrollTop = boxRef.current.scrollHeight;
  }, [msgs, typing, open]);
  useEffect(()=>()=>clearTimeout(timerRef.current), []);
  const send = (raw)=>{
    const text = (raw!==undefined ? raw : input).trim();
    if(!text || typing) return;
    setInput('');
    setMsgs(m=>m.concat([{who:'user', text:text}]));
    setTyping(true);
    const delay = model ? 10 : 550 + Math.random()*450;
    timerRef.current = setTimeout(()=>{
      /* ETAP 2: if (model) → await model.generate(text, lang) — ONNX Runtime Web, lokalnie w przeglądarce */
      const reply = model ? model.answer(text, lang) : faqAnswer(text, t.chat.answers);
      setTyping(false);
      setMsgs(m=>m.concat([{who:'bot', text:reply}]));
    }, delay);
  };
  const onKey = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } };
  return (
    <React.Fragment>
      <button className={'fab'+(open?' active':'')} onClick={()=>setOpen(o=>!o)} aria-label={open?t.chat.ariaClose:t.chat.ariaOpen}>
        <Icon name={open?'x':'msg'} size={24}/>
      </button>
      <div className={'chat'+(open?'':' closed')} role="dialog" aria-label={'NERU — '+t.chat.status}>
        <div className="chat-hd">
          <span className="chat-dot"></span>
          <span className="chat-name">{t.chat.title}</span>
          <span className="chat-status">{t.chat.status}</span>
          <button className="chat-x" onClick={()=>setOpen(false)} aria-label={t.chat.ariaClose}><Icon name="x" size={18}/></button>
        </div>
        <div className="chat-msgs" ref={boxRef} aria-live="polite">
          {msgs.map((m,i)=>(<div key={i} className={'msg '+m.who}>{m.text}</div>))}
          {typing && <div className="typing" aria-hidden="true"><i></i><i></i><i></i></div>}
        </div>
        <div className="chat-faq">
          {t.chat.faq.map(q=>(<button key={q} onClick={()=>send(q)}>{q}</button>))}
        </div>
        <div className="chat-in">
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={onKey} placeholder={t.chat.ph} aria-label={t.chat.ph}/>
          <button className="chat-send" onClick={()=>send()} disabled={!input.trim()||typing} aria-label={t.chat.send}><Icon name="send" size={17}/></button>
        </div>
        <div className="chat-note">{t.chat.note}</div>
      </div>
    </React.Fragment>
  );
}

    </div>
    <div id="neru-chat-messages" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;color:#e8ecf2;font-size:14px;line-height:1.5"></div>
    <div style="padding:12px;border-top:1px solid rgba(255,255,255,0.08);display:flex;gap:8px">
      <input id="neru-chat-input" type="text" placeholder="Napisz pytanie..." style="flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 12px;color:#e8ecf2;font-size:14px;outline:none">
      <button id="neru-chat-send" style="background:#00f0ff;color:#0a0c10;border:none;border-radius:8px;padding:0 16px;cursor:pointer;font-weight:600">→</button>
    </div>
  `;
  document.body.appendChild(chatPanel);

  const status = chatPanel.querySelector("#neru-chat-status");
  const msgs = chatPanel.querySelector("#neru-chat-messages");
  const input = chatPanel.querySelector("#neru-chat-input");
  const sendBtn = chatPanel.querySelector("#neru-chat-send");

  function addMsg(role, text) {
    const d = document.createElement("div");
    d.style.cssText = role === "user" ? "align-self:flex-end;background:rgba(0,240,255,0.1);border-radius:12px;padding:8px 12px;max-width:80%" : "align-self:flex-start;background:rgba(168,85,247,0.08);border-radius:12px;padding:8px 12px;max-width:80%";
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
  }

  chatBtn.onclick = () => {
    chatPanel.style.display = chatPanel.style.display === "flex" ? "none" : "flex";
    if (!engine && !loading) loadModel();
  };

  async function loadModel() {
    loading = true;
    status.textContent = "ładowanie modelu (~500MB, jednorazowo)...";
    status.style.color = "#fbbf24";
    try {
      engine = await CreateMLCEngine(MODEL_ID, {
        initProgressCallback: (p) => {
          status.textContent = `ładowanie: ${Math.round((p.progress||0)*100)}%`;
        }
      });
      status.textContent = "gotowy";
      status.style.color = "#2DD4A8";
      addMsg("neru", "Cześć! Jestem NERU. Zapytaj o projekt, pobieranie, lub cokolwiek.");
    } catch(e) {
      status.textContent = "model offline";
      status.style.color = "#f87171";
      addMsg("neru", "Model nie może się załadować. Sprawdź czy przeglądarka wspiera WebGPU. Tu znajdziesz pomoc: github.com/aztun-neru/neru");
    }
    loading = false;
  }

  async function ask() {
    const q = input.value.trim();
    if (!q || !engine) return;
    input.value = "";
    addMsg("user", q);
    status.textContent = "myślę...";
    status.style.color = "#fbbf24";
    try {
      const r = await engine.chat.completions.create({
        messages: [
          {role: "system", content: "Jesteś NERU — pomocnik na stronie aztun.com. Odpowiadaj zwięźle po polsku. Pomagaj z pytania o NERU (lokalny asystent), pobieranie, konfigurację. Jeśli nie wiesz - powiedz że nie wiesz, nie zmyślaj."},
          {role: "user", content: q}
        ],
        temperature: 0.7,
        max_tokens: 200
      });
      addMsg("neru", r.choices[0]?.message?.content || "Brak odpowiedzi");
      status.textContent = "gotowy";
      status.style.color = "#2DD4A8";
    } catch(e) {
      addMsg("neru", "Błąd: " + e.message);
      status.textContent = "błąd";
      status.style.color = "#f87171";
    }
  }

  sendBtn.onclick = ask;
  input.onkeydown = (e) => { if (e.key === "Enter") ask(); };
</script>

</body>
</html>
